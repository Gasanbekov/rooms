services:
  db:
    image: postgres:16
    container_name: rooms-db
    environment:
      POSTGRES_USER: rooms
      POSTGRES_DB: rooms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rooms-pgdata:/var/lib/postgresql/data
volumes:
  rooms-pgdata:

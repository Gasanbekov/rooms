name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rooms
          POSTGRES_PASSWORD: rooms
          POSTGRES_DB: rooms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rooms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://rooms:rooms@localhost:5432/rooms_test
      - run: npm run typecheck
